<app-modal-header
  title="Confirmar pagamento"
  description="Confira os dados antes de confirmar a transferência."
  icon="payments" />

<app-modal-body>
  <app-form-section title="Você paga para">
    <p class="sh-payment__name">{{ user?.name }}</p>
  </app-form-section>

  <app-summary-block title="Valor" icon="price_check" variant="primary">
    <strong class="sh-payment__amount">{{ data.unitValue | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</strong>
  </app-summary-block>

  <app-form-section title="Chave PIX" description="Use esta chave para transferir o valor acima.">
    <p class="sh-payment__pix">{{ user?.pixKey }}</p>
  </app-form-section>
</app-modal-body>

<app-modal-footer align="end">
  <button mat-button cdkFocusInitial (click)="cancelar()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="efetuarPagamento()" [disabled]="loading()">
    <mat-spinner *ngIf="loading()" diameter="18"></mat-spinner>
    <span *ngIf="!loading()">Pagar</span>
  </button>
</app-modal-footer>
