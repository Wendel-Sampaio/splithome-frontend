<h2 class="title" mat-dialog-title>
  <mat-icon aria-hidden="true">warning</mat-icon>
  Confirmar exclusão
</h2>

<mat-dialog-content class="content">
  <p>
    Tem certeza que deseja excluir {{ data.itemType }} <strong>{{ data.title }}</strong>?
  </p>
  <p class="value">Valor: <strong>{{ data.valueLabel }}</strong></p>
  <p class="warning">Essa ação não pode ser desfeita.</p>
</mat-dialog-content>

<mat-dialog-actions class="actions" align="end">
  <button mat-button [mat-dialog-close]="false" cdkFocusInitial>Cancelar</button>
  <button class="confirm-button" mat-flat-button [mat-dialog-close]="true">
    <mat-icon aria-hidden="true">delete</mat-icon>
    Excluir
  </button>
</mat-dialog-actions>
