<app-modal-header
  title="Confirmar exclusão"
  description="Esta ação não pode ser desfeita."
  icon="warning"
  variant="danger" />

<app-modal-body>
  <p class="sh-confirm-delete__lead">
    Tem certeza que deseja excluir {{ data.itemType }}
    <strong>{{ data.title }}</strong>?
  </p>

  @if (data.valueLabel) {
    <p class="sh-confirm-delete__value">
      <mat-icon aria-hidden="true">payments</mat-icon>
      <span>Valor: <strong>{{ data.valueLabel }}</strong></span>
    </p>
  }
</app-modal-body>

<app-modal-footer align="end">
  <button mat-button cdkFocusInitial [mat-dialog-close]="false">Cancelar</button>
  <button mat-flat-button color="warn" [mat-dialog-close]="true">
    <mat-icon aria-hidden="true">delete</mat-icon>
    Excluir
  </button>
</app-modal-footer>
