<app-modal-header
  title="Login com {{ providerName }} em breve"
  description="Estamos preparando essa novidade para você."
  icon="schedule" />

<app-modal-body>
  <p class="sh-social__lead">
    O acesso via <strong>{{ providerName }}</strong> ainda não está disponível,
    mas estamos preparando essa novidade para você.
  </p>

  <app-summary-block title="Por enquanto" icon="auto_awesome" variant="primary">
    Crie sua conta manualmente em poucos segundos e comece a controlar os gastos da sua casa agora mesmo.
  </app-summary-block>
</app-modal-body>

<app-modal-footer align="end">
  <button mat-button mat-dialog-close>Agora não</button>
  <button mat-flat-button color="primary" (click)="goToRegister()">
    <mat-icon aria-hidden="true">person_add</mat-icon>
    Criar minha conta
  </button>
</app-modal-footer>
