<app-modal-header
  title="Recurso Premium"
  description="Esta funcionalidade faz parte do plano Premium da SplitHome."
  icon="workspace_premium" />

<app-modal-body>
  <app-form-section title="Por que fazer upgrade" [description]="message" />

  <app-form-section title="Benefícios inclusos" description="Tudo o que você desbloqueia ao ser Premium.">
    <ul class="sh-upgrade__benefits" aria-label="Benefícios do plano Premium">
      @for (benefit of benefits; track benefit.title) {
        <li class="sh-upgrade__benefit">
          <span class="sh-upgrade__benefit-icon" aria-hidden="true">
            <mat-icon>{{ benefit.icon }}</mat-icon>
          </span>
          <span class="sh-upgrade__benefit-text">
            <strong>{{ benefit.title }}</strong>
            <span>{{ benefit.description }}</span>
          </span>
        </li>
      }
    </ul>
  </app-form-section>

  @if (showInstructions) {
    <app-summary-block title="Como fazer upgrade" icon="support_agent" variant="info">
      Entre em contato pelo canal de atendimento da SplitHome e solicite a ativação do plano Premium para sua conta.
    </app-summary-block>
  }
</app-modal-body>

<app-modal-footer align="end">
  <button mat-button mat-dialog-close>Agora não</button>
  <button mat-flat-button color="primary" cdkFocusInitial (click)="showUpgradeInstructions()">Fazer upgrade</button>
</app-modal-footer>
