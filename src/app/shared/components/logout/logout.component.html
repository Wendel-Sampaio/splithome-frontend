<app-modal-header title="Sair" description="Encerrar a sessão atual" icon="logout" />

<app-modal-body>
  <p>Você tem certeza que deseja sair da sua conta agora?</p>
</app-modal-body>

<app-modal-footer align="space-between">
  <button mat-button cdkFocusInitial (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="logout()">Sim, sair</button>
</app-modal-footer>
