<h2 class="title" mat-dialog-title>Sair</h2>
<mat-dialog-content>
  <p>Você tem certeza que deseja sair?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button cdkFocusInitial class="cancel-button" mat-button mat-dialog-close>Cancelar</button>
  <button class="confirm-button" mat-button mat-dialog-close (click)="logout()">Sim</button>
</mat-dialog-actions>
