<div class="card-body">
  <mat-card-title class="titulo-menu-compras">Despesas</mat-card-title>
  <button mat-button class="cadastrar-compra" (click)="abrirFormDespesa()">
    <mat-icon>add_circle</mat-icon>Nova despesa
  </button>
</div>

<div class="table" *ngIf="despesas.length > 0; else noData">
  <table mat-table [dataSource]="despesas">
    <ng-container matColumnDef="title">
      <th class="column-name" mat-header-cell *matHeaderCellDef>Título</th>
      <td mat-cell *matCellDef="let element">{{ element.title }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th class="column-name" mat-header-cell *matHeaderCellDef>Categoria</th>
      <td mat-cell *matCellDef="let element">{{ element.category }}</td>
    </ng-container>

    <ng-container matColumnDef="expenseDate">
      <th class="column-name" mat-header-cell *matHeaderCellDef>Data</th>
      <td mat-cell *matCellDef="let element">{{ element.expenseDate | date: 'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="value">
      <th class="column-name" mat-header-cell *matHeaderCellDef>Valor</th>
      <td mat-cell *matCellDef="let element">{{ element.value | currency : 'BRL' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>

<ng-template #noData>
  <div class="empty-state">Nenhuma despesa pessoal cadastrada.</div>
</ng-template>
