<main class="auth-page">
  <!-- Fundo com ondas verdes -->
  <svg class="auth-bg" viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path class="wave-light"
      d="M0,430 C 260,520 380,360 620,350 C 900,340 1080,140 1440,150 L1440,820 L0,820 Z" />
    <path class="wave-dark"
      d="M0,520 C 260,600 400,470 640,460 C 920,450 1120,240 1440,250 L1440,820 L0,820 Z" />
  </svg>

  <div class="auth-content">
    <!-- Card de login -->
    <section class="auth-card" aria-label="Login no SplitHome">

      <div class="brand">
        <img class="brand-logo" src="../../../assets/logo-semfundo.png" alt="SplitHome">
      </div>

      <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="login()" *ngIf="!resetMode()">
        <div class="field" [class.field--invalid]="isInvalid('email')">
          <input formControlName="email" type="email" placeholder="E-mail" autocomplete="email" aria-label="E-mail">
          <mat-icon>person</mat-icon>
        </div>

        <div class="field" [class.field--invalid]="isInvalid('password')">
          <input formControlName="password" [type]="hide1() ? 'password' : 'text'" placeholder="Senha"
            autocomplete="current-password" aria-label="Senha">
          <button type="button" class="field-toggle" (click)="clickEventPassword($event)"
            [attr.aria-label]="hide1() ? 'Mostrar senha' : 'Ocultar senha'" [attr.aria-pressed]="!hide1()">
            <mat-icon>{{ hide1() ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </div>

        <button type="button" class="forgot-link" (click)="openPasswordReset()">Esqueci minha senha</button>

        <button type="submit" class="auth-submit" [disabled]="loading() || loginForm.invalid">
          <mat-spinner *ngIf="loading()" diameter="20"></mat-spinner>
          <span *ngIf="!loading()">Entrar</span>
        </button>
      </form>

      <form class="auth-form reset-form" [formGroup]="resetForm" *ngIf="resetMode()" (ngSubmit)="resetCodeSent() ? confirmPasswordReset() : requestPasswordReset()">
        <div class="field" [class.field--invalid]="isResetInvalid('email')">
          <input formControlName="email" type="email" placeholder="E-mail" autocomplete="email" aria-label="E-mail">
          <mat-icon>mail</mat-icon>
        </div>

        <ng-container *ngIf="resetCodeSent()">
          <div class="field" [class.field--invalid]="isResetInvalid('code')">
            <input formControlName="code" inputmode="numeric" maxlength="6" placeholder="Código" autocomplete="one-time-code" aria-label="Código">
            <mat-icon>pin</mat-icon>
          </div>

          <div class="field" [class.field--invalid]="isResetInvalid('newPassword')">
            <input formControlName="newPassword" [type]="hideResetPassword() ? 'password' : 'text'" placeholder="Nova senha"
              autocomplete="new-password" aria-label="Nova senha">
            <button type="button" class="field-toggle" (click)="clickEventResetPassword($event)"
              [attr.aria-label]="hideResetPassword() ? 'Mostrar senha' : 'Ocultar senha'" [attr.aria-pressed]="!hideResetPassword()">
              <mat-icon>{{ hideResetPassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
          </div>

          <div class="field" [class.field--invalid]="isResetInvalid('repeatPassword') || resetForm.hasError('passwordMismatch')">
            <input formControlName="repeatPassword" [type]="hideResetPasswordConfirm() ? 'password' : 'text'" placeholder="Confirmar senha"
              autocomplete="new-password" aria-label="Confirmar senha">
            <button type="button" class="field-toggle" (click)="clickEventResetPasswordConfirm($event)"
              [attr.aria-label]="hideResetPasswordConfirm() ? 'Mostrar senha' : 'Ocultar senha'" [attr.aria-pressed]="!hideResetPasswordConfirm()">
              <mat-icon>{{ hideResetPasswordConfirm() ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
          </div>
        </ng-container>

        <button type="submit" class="auth-submit" [disabled]="resetLoading() || (resetCodeSent() ? resetForm.invalid : resetForm.get('email')?.invalid)">
          <mat-spinner *ngIf="resetLoading()" diameter="20"></mat-spinner>
          <span *ngIf="!resetLoading()">{{ resetCodeSent() ? 'Alterar senha' : 'Enviar código' }}</span>
        </button>

        <button type="button" class="forgot-link forgot-link--center" (click)="backToLogin()">Voltar para login</button>
      </form>

      <div class="social" aria-label="Entrar com redes sociais" *ngIf="!resetMode()">
        <button type="button" class="social-btn social-btn--google" aria-label="Entrar com Google"
          (click)="openSocialUnavailable('google')">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        </button>
        <button type="button" class="social-btn social-btn--facebook" aria-label="Entrar com Facebook"
          (click)="openSocialUnavailable('facebook')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#ffffff" d="M15.12 12.75h2.36l.37-2.87h-2.73V8.03c0-.83.23-1.4 1.42-1.4h1.52V4.06a20.3 20.3 0 0 0-2.21-.11c-2.19 0-3.69 1.34-3.69 3.79v2.14H10.2v2.87h2.36V20h2.56v-7.25z"/>
          </svg>
        </button>
      </div>

      <p class="auth-footer" *ngIf="!resetMode()">
        Não tem uma conta? <a href="/cadastro">cadastre-se aqui.</a>
      </p>
    </section>

    <!-- Chamada à ação -->
    <aside class="auth-hero" aria-hidden="true">
      <p class="hero-lead">Controle seus gastos com</p>
      <p class="hero-title">Facilidade <span class="hero-arrows">&#8250;&#8250;&#8250;</span></p>
    </aside>
  </div>
</main>
