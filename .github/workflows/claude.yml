name: Claude AI Agent

on:
  # Responde a @claude em issues e PRs
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

  # Roda automaticamente todo dia útil às 9h (horário de Brasília = 12h UTC)
  schedule:
    - cron: "0 12 * * 1-5"

  # Permite rodar manualmente pelo GitHub
  workflow_dispatch:
    inputs:
      prompt:
        description: "Instrução para o Claude"
        required: false
        default: "Revise as issues abertas e resolva as marcadas com 'auto-fix' ou 'good first issue'."

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Agente Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-6
          max_turns: 20
          prompt: ${{ github.event.inputs.prompt || 'Revise as issues abertas com `gh issue list`. Para issues com label "auto-fix" ou "good first issue": crie uma branch seguindo o padrão `{numero}-{descricao}`, implemente a correção usando Standalone Components Angular 19, rode `npm test -- --watch=false --browsers=ChromeHeadless` para validar e abra um PR linkando a issue com `Closes #numero`.' }}
          allowed_tools: "Bash,Read,Edit,Write,Glob,Grep"
